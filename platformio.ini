; PlatformIO Project Configuration File for Meshpunk
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = meshpunk

; Board-neutral base shared by every device env. Per-board pins/backends are
; selected by the -DBOARD_<NAME> define (see src/boards/board_pins.h and the
; src/<subsystem>/*_dev.h backends).
[meshpunk_base]
platform = espressif32@6.11.0
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DESP32
    -DMESH_PLATFORM
    -DARDUINO_PLATFORM
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -mlongcalls
    -Wno-error=maybe-uninitialized
    -Ilib/MeshCore/src
    -Ilib/MeshCore/lib/ed25519
    -Isrc
    -D RADIO_CLASS=CustomSX1262
    -D WRAPPER_CLASS=CustomSX1262Wrapper
    -D MAX_CONTACTS=500
    -D MAX_GROUP_CHANNELS=20
    -D LORA_FREQ=910.525
    -D LORA_BW=62.5
    -D LORA_SF=7
    -D LORA_TX_POWER=20
    ; BLE companion app support (MeshCore companion protocol over BLE)
    -D BLE_COMPANION_ENABLED=1
    -D BLE_PIN_CODE=123456
    -D BLE_NAME_PREFIX=\"MeshPunk\"
    -D BLE_DEBUG_LOGGING=0
    -D OFFLINE_QUEUE_SIZE=16
    ; Dual-core refactor: Arduino loop() runs on Core 0 (UI domain),
    ; mesh_task pinned to Core 1 (radio domain) from meshpunk_tasks.cpp.
    -DARDUINO_RUNNING_CORE=0
    -DCONFIG_ARDUINO_RUNNING_CORE=0
    -DARDUINO_LOOP_STACK_SIZE=16384

; Strip the platform's default `-DARDUINO_RUNNING_CORE=1` etc. BEFORE our
; build_flags add them back as =0. Without this the command-line sees both
; definitions and gcc warns on every compilation unit.
build_unflags =
    -fno-tree-switch-conversion
    -DARDUINO_RUNNING_CORE=1
    -DCONFIG_ARDUINO_RUNNING_CORE=1

board_build.partitions = meshpunk_custom_16Mb.csv

; src/updater/ is the standalone updater firmware (its own envs below). It
; defines its own setup()/loop() and stays out of the main build.
build_src_filter = +<*> -<updater/>

; Libraries path for both local libs and TDeck example libs
lib_extra_dirs =
    ${PROJECT_DIR}/lib

; Deps
lib_deps =
  adafruit/RTClib
  adafruit/Adafruit BusIO
  densaugeo/base64 @ ~1.4.0
  ;stevemarple/MicroNMEA @ ^2.0.6
  ;end2endzone/NonBlockingRTTTL@^1.3.0

; File System configuration for uploading data
board_build.filesystem = littlefs

; ── LilyGo T-Deck (dev) ──────────────────────────────────────────────────────
[env:meshpunk]
extends = meshpunk_base
board = T-Deck
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags =
    ${meshpunk_base.build_flags}
    ; Board select for the per-device backends (src/input/input_tdeck.cpp etc.
    ; compile only under this define; other boards add their own).
    -DBOARD_TDECK
    ; TFT_eSPI: T-Deck panel config comes from the vendored
    ; User_Setups/Setup210_LilyGo_T_Deck.h; the shared SPI bus is FSPI.
    -DUSE_FSPI_PORT
    -D PIN_VBAT_READ=4
    -D MAX_LORA_TX_POWER=20
extra_scripts =
    pre:fix_lvgl_build.py
    post:merge_bin.py
; extra_scripts = post:upload_data.py

; Release build: same firmware plus the data/ tree embedded as a compressed
; pack (pack/data_pack.bin) that the app extracts into LittleFS on first boot.
; This makes firmware.bin self-contained for the Launcher and web flashers.
; The default (dev) env skips the pack to keep uploads fast; release artifacts
; come from `pio run -e meshpunk_release`.
[env:meshpunk_release]
extends = env:meshpunk
build_flags =
    ${env:meshpunk.build_flags}
    -DMESHPUNK_EMBED_PACK=1
board_build.embed_files = pack/data_pack.bin
extra_scripts =
    pre:fix_lvgl_build.py
    pre:make_data_pack.py
    post:merge_bin.py

; ── Updater firmware (T-Deck) ───────────────────────────────────────────────
; A standalone program in the `updater` factory partition (0x590000, 0x80000
; in meshpunk_custom_16Mb.csv). The main firmware stages a new image on the
; SD card or LittleFS, writes /.ota_job and reboots into it; it streams the
; file into the `main` partition and boots it (src/updater/main_updater.cpp).
; It extends the board env so the board define and the TFT_eSPI panel config
; are identical. Upload lands at the updater offset and the size check is the
; updater partition. merge_bin.py includes .pio/build/<this env>/firmware.bin
; in merged.bin, so build this env before a merged/release build.
[env:meshpunk_updater]
extends = env:meshpunk
build_src_filter = +<updater/>
build_flags =
    ${env:meshpunk.build_flags}
    -DMESHPUNK_UPDATER=1
; lib_deps is inherited on purpose: PlatformIO deletes .pio/libdeps/<env> on
; every dependency resolve when lib_deps is empty and then reinstalls the
; vendored libraries' declared dependencies into it, which VS Code's project
; configuration triggers on every activation. The inherited libraries are kept
; out of this build below.
lib_ignore =
    RTClib
    Adafruit BusIO
    base64
    lvgl
    luavgl
    lua
    MeshCore
    RadioLib
    elf_loader
    ESP32-audioI2S
    es7210
    TouchLib
    SensorsLib
    TinyGPSPlus
    AceButton
    Arduino_GFX
    ed25519
extra_scripts =
board_build.app_partition_name = updater
board_upload.offset_address = 0x590000

; ── Updater firmware (Heltec) ───────────────────────────────────────────────
; Same program for the Heltec kit; the TFT_eSPI text fonts it draws with come
; from the board env's flags.
[env:meshpunk_heltec_updater]
extends = env:meshpunk_heltec
build_src_filter = +<updater/>
build_flags =
    ${env:meshpunk_heltec.build_flags}
    -DMESHPUNK_UPDATER=1
; lib_deps is inherited on purpose: PlatformIO deletes .pio/libdeps/<env> on
; every dependency resolve when lib_deps is empty and then reinstalls the
; vendored libraries' declared dependencies into it, which VS Code's project
; configuration triggers on every activation. The inherited libraries are kept
; out of this build below.
lib_ignore =
    RTClib
    Adafruit BusIO
    base64
    lvgl
    luavgl
    lua
    MeshCore
    RadioLib
    elf_loader
    ESP32-audioI2S
    es7210
    TouchLib
    SensorsLib
    TinyGPSPlus
    AceButton
    Arduino_GFX
    ed25519
extra_scripts =
board_build.app_partition_name = updater
board_upload.offset_address = 0x590000

; ── Heltec WiFi LoRa 32 V4-R8 + Expansion Kit V2 (dev) ──────────────────────
; ST7789 240x320 TFT (rot 1 -> 320x240) + CHSC6X touch, SX1262 behind a
; GC1109/KCT8103L RF front-end (runtime-detected), L76K GPS, piezo buzzer.
; LoRa sits alone on FSPI (9/11/10); the panel gets HSPI (17/33) — separate
; buses, unlike the T-Deck.
[env:meshpunk_heltec]
extends = meshpunk_base
board = heltec_v4_r8
build_flags =
    ${meshpunk_base.build_flags}
    -DBOARD_HELTEC_V4
    ; TFT_eSPI panel config (no vendored Setup file for this board; the
    ; T-Deck env keeps Setup210 because USER_SETUP_LOADED is undefined there).
    ; PINS ARE R8-EX SPECIFIC, decoded from the Expansion_board_V2.03 +
    ; HTIT-WBR8H_V4.3.2 schematics: the widely published base-V4 kit pins
    ; (MOSI 33 etc.) are WRONG for the R8 — GPIO33-37 sit on the in-package
    ; octal PSRAM bus and touching them hard-hangs the chip (hw-confirmed).
    ; TFT_RST=21 is SHARED with the touch controller's reset.
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1
    -D TFT_MOSI=15
    -D TFT_SCLK=16
    -D TFT_CS=47
    -D TFT_DC=48
    -D TFT_RST=21
    -D TFT_INVERSION_ON=1
    ; Panel is BGR-wired (T-Deck's is RGB): without this, saturated colors
    ; render R/B-swapped — invisible on the grayscale UI, obvious on yellow
    ; emojis (they turned cyan-blue).
    -D TFT_RGB_ORDER=TFT_BGR
    -D SPI_FREQUENCY=40000000
    -D USE_HSPI_PORT=1
    ; TFT_eSPI text fonts for the updater's panel text (the T-Deck gets them
    ; from its vendored Setup210).
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    ; RF front-end control lines (names match the MeshCore heltec_v4 variant
    ; the FEM driver was copied from — see src/boards/heltec_fem.cpp)
    -D P_LORA_PA_POWER=7
    -D P_LORA_GC1109_PA_EN=2
    -D P_LORA_GC1109_PA_TX_EN=46
    -D P_LORA_KCT8103L_PA_CSD=2
    -D P_LORA_KCT8103L_PA_CTX=5
    ; Battery measurement (PunkHeltecBoard: 390K/100K divider, no ADC gate
    ; on the R8 — the base V4's GPIO37 gate is an octal-PSRAM pin here)
    -D PIN_VBAT_READ=1
    ; CRITICAL: without these, MeshCore's ESP32Board::begin() calls
    ; Wire.begin() on the generic esp32s3 variant's DEFAULT I2C pins — SDA=8
    ; SCL=9, which are the radio's NSS and SCK. That rerouted the SPI pins
    ; through the I2C matrix and made every RadioLib read return 0xFF.
    ; -1/-1 makes ESP32Board skip Wire.begin entirely (touch owns the real
    ; I2C on Wire1 17/18).
    -D PIN_BOARD_SDA=-1
    -D PIN_BOARD_SCL=-1
    ; TX power is RADIATED dBm everywhere in the UI; the Heltec radio path
    ; subtracts the FEM gain curve before setOutputPower (max 22 radiated).
    -D MAX_LORA_TX_POWER=22
extra_scripts =
    pre:fix_lvgl_build.py
    post:merge_bin.py

; Heltec release build: same pattern as meshpunk_release - the data/ tree is
; embedded as a compressed pack the app extracts into LittleFS on first boot,
; so firmware.bin is self-contained. merge_bin.py names the artifacts with
; the heltec_v4 board slug and skips the Launcher image (no Launcher firmware
; exists for this board). Release artifacts: pio run -e meshpunk_heltec_release
[env:meshpunk_heltec_release]
extends = env:meshpunk_heltec
build_flags =
    ${env:meshpunk_heltec.build_flags}
    -DMESHPUNK_EMBED_PACK=1
board_build.embed_files = pack/data_pack.bin
extra_scripts =
    pre:fix_lvgl_build.py
    pre:make_data_pack.py
    post:merge_bin.py
